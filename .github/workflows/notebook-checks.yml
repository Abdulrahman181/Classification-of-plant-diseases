name: Notebook checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check notebook JSON, Python syntax, and output hygiene
        run: python3 scripts/check_notebooks.py
      - name: Run static notebook policy tests
        run: python3 -m unittest discover -s tests -v
